# Configuration for Qubes OS build server: Qubes devel - Fedora packages

include:
 - /home/user/builder-devel/sources/contrib-configs/example-configs/qubes-os-contrib-main.yml

gpg-client: qubes-gpg-client-wrapper
repository-publish:
  components: current-testing

use-qubes-repo: {}

fetch-versions-only: false
increment-devel-versions: true
reuse-fetched-source: true

distributions:
  - vm-fc43
  - vm-fc44
  - vm-fc45

+components:
  - builder-rpm:
      packages: False
      fetch-versions-only: false
      prefix: QubesOS/qubes-
      branch: main

templates: []

